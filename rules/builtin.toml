# Independently authored rules. No downloaded or executable rules are loaded.

[[rule]]
id = "windows.user_temp"
version = 2
title = "用户临时文件"
description = "当前用户临时目录中至少 24 小时未修改的文件"
impact = "删除较早的临时文件；正在使用或最近修改的文件会保留。"
root = "user_temp"
relative = ""
min_age_days = 1
requires_admin = false
default_selected = true
cleanup_policy = "recommended"

[[rule]]
id = "windows.system_temp"
version = 2
title = "系统临时文件"
description = "Windows 临时目录中至少 24 小时未修改的文件"
impact = "需要管理员权限；仅处理 Windows 临时目录，不处理系统组件。"
root = "system_temp"
relative = ""
min_age_days = 1
requires_admin = true
default_selected = false
cleanup_policy = "review"

[[rule]]
id = "edge.http"
version = 1
title = "Edge 网页缓存"
description = "标准用户配置中的 HTTP 磁盘缓存"
impact = "网页图片和资源需要重新下载；保留登录状态、历史记录和密码。"
root = "edge"
relative = "Cache/Cache_Data"
min_age_days = 0
process = "msedge.exe"
requires_admin = false
default_selected = true
cleanup_policy = "recommended"

[[rule]]
