name: Windows verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: rustup show
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:quality
      - run: git diff --exit-code
      - run: pnpm prepare:helper
      - run: cargo check -p dustaway --features system-cleanup
      - run: pnpm portable
      - uses: actions/upload-artifact@v4
        with:
          name: DustAway-unsigned-preview-x64
          path: artifacts/portable/拂尘_*_windows-x64/*
