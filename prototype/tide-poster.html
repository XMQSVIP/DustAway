<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>拂尘 · 退潮</title>
  <style>

    :root {
      --bg:#f7f8fa; --surface:#fff; --ink:#20232b; --muted:#666c79;
      --blue:#263dbb; --blue-ink:#fff; --blue-soft:#e9edff; --apricot:#efb38b;
      --line:#dce0e7; --soft:#edf0f5; --success:#38654c; --danger:#b13d4a;
      --danger-soft:#faecee; --orange-ink:#825033; --shadow:0 22px 80px #18234120;
      --ticket:#263dbb; --ticket-ink:#fff; --quick:120ms; --ease:cubic-bezier(.2,.8,.2,1);
      font-family:"Microsoft YaHei UI","Microsoft YaHei","Segoe UI",sans-serif;
      font-size:15px; color:var(--ink); background:var(--bg); color-scheme:light;
    }
    :root[data-theme="dark"] {
      --bg:#151921; --surface:#202631; --ink:#f1f3f8; --muted:#b0b7c6;
      --blue:#a3b4ff; --blue-ink:#172354; --blue-soft:#2c3554; --apricot:#efb38b;
      --line:#3a4252; --soft:#292f3d; --success:#9bcdb2; --danger:#ffa4af;
      --danger-soft:#442c36; --orange-ink:#efb38b; --shadow:0 22px 80px #0005;
      --ticket:#2b43c3; --ticket-ink:#fff; color-scheme:dark;
    }
    * { box-sizing:border-box }
    body { margin:0; overflow:hidden }
    button,input,select { font:inherit }
    button,a,input,select,summary { -webkit-tap-highlight-color:transparent }
    button { cursor:pointer; color:inherit; border:0; background:none; touch-action:manipulation }
    button:disabled { cursor:not-allowed; opacity:.45 }
    button:not(:disabled):active { transform:translateY(1px) }
    button,input,select,summary { transition:background var(--quick),color var(--quick),box-shadow var(--quick) }
    :focus-visible { outline:3px solid var(--blue); outline-offset:4px }
    [hidden] { display:none!important }
    h1,h2,h3,p { margin:0 }
    h1,h2 { font-weight:650; text-wrap:balance }
    h1 { font-size:32px; letter-spacing:-1px; line-height:1.35 }
    h2 { font-size:20px; line-height:1.4 }
    h3 { font-size:16px; font-weight:650 }
    p { line-height:1.7 }
    small,.small { font-size:13px }
    svg.icon { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.65; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0 }
    .muted { color:var(--muted) }
    .number { font-variant-numeric:tabular-nums; font-family:"Segoe UI Variable Display","Segoe UI","Microsoft YaHei UI",sans-serif }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0 }
    .skip { position:fixed; left:24px; top:-80px; z-index:30; padding:12px; background:var(--surface); border:2px solid var(--blue); color:var(--ink) }
    .skip:focus { top:12px }
    .button { display:inline-flex; align-items:center; justify-content:center; gap:10px; min-height:44px; padding:10px 18px; border:1px solid var(--line); border-radius:12px; font-weight:550; background:var(--surface); white-space:nowrap }
    .button:hover:not(:disabled) { background:var(--soft) }
    .button.primary { background:var(--blue); color:var(--blue-ink); border-color:transparent; box-shadow:0 4px 10px #3155d91a }
    .button.primary:hover:not(:disabled) { filter:brightness(1.07); background:var(--blue) }
    .button.hero-button { min-height:56px; padding:14px 24px; font-size:16px; border-radius:15px; min-width:190px; justify-content:space-between }
    .button.danger { background:var(--danger); color:var(--surface); border-color:transparent }
    .text-button { display:inline-flex; align-items:center; justify-content:center; gap:7px; color:var(--blue); font-size:14px; min-height:38px; padding:6px 2px; white-space:nowrap }
    .text-button:hover { text-decoration:underline; text-underline-offset:4px }
    .tag { display:inline-flex; align-items:center; gap:6px; font-size:12px; border-radius:6px; padding:4px 8px; color:var(--muted); background:var(--soft); white-space:nowrap }
    .tag.warm { color:var(--orange-ink); background:color-mix(in srgb,var(--apricot) 20%,var(--surface)) }
    .tag.blue { color:var(--blue); background:var(--blue-soft) }
    .tag.success { color:var(--success); background:color-mix(in srgb,var(--success) 9%,var(--surface)) }

    h1 { font-size:32px; font-weight:500; letter-spacing:-1.2px; line-height:1.35 }
    h2 { font-weight:550 } button { font-weight:400 }
    .app { height:100vh; height:100dvh; display:flex; flex-direction:column; max-width:1600px; margin:auto }
    .topbar { height:84px; display:flex; align-items:center; gap:30px; padding:0 44px; flex-shrink:0 }
    .brand { display:flex; align-items:center; gap:10px; min-width:160px }
    .brand-mark { width:29px; height:35px; color:var(--blue); flex-shrink:0 }
    .brand-name { font-size:23px; font-weight:650; letter-spacing:3px }
    .brand-note { font-family:"Segoe UI",sans-serif; color:var(--muted); font-size:10px; letter-spacing:.5px; margin-top:3px }
    .navigation { display:flex; gap:8px; margin:auto; align-items:center }
    .nav-button { min-height:40px; padding:8px 19px; color:var(--muted); font-size:14px; border-radius:22px; white-space:nowrap }
    .nav-button:hover { color:var(--ink); background:var(--soft) }
    .nav-button[aria-current="page"] { background:var(--ink); color:var(--surface) }
    .top-actions { display:flex; gap:15px; align-items:center }
    .local-label { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:11px; white-space:nowrap }
    .local-label i { height:5px; width:5px; background:var(--success); border-radius:50% }
    .icon-button { border:1px solid var(--line); border-radius:50%; width:36px; height:36px; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0 }
    .icon-button:hover { background:var(--soft) }
    .workspace { flex:1; min-height:0; overflow:auto; scrollbar-gutter:stable; scroll-padding:24px }
    .page { margin:auto; max-width:1380px; padding:26px 44px 34px }
    .page-head { display:flex; justify-content:space-between; align-items:center; gap:20px; margin-bottom:25px }
    .page-head p { color:var(--muted); margin-top:9px; font-size:13px }
    .button { border-radius:8px; box-shadow:none!important; font-size:14px }
    .button.primary { font-weight:500 }
    .text-button { color:var(--blue); display:inline-flex; align-items:center; gap:7px; padding:7px 0; min-height:36px; font-size:13px }
    .text-button:hover { text-decoration:underline; text-underline-offset:4px }
    .tag { border-radius:4px; font-size:11px; padding:4px 7px }
    .footer { min-height:34px; padding:0 44px; display:flex; justify-content:space-between; align-items:center; gap:16px; flex-shrink:0; color:var(--muted); font-size:10px; border-top:1px solid var(--line) }
    .prototype-mark { display:flex; align-items:center; gap:7px; white-space:nowrap }
    .prototype-mark i { height:4px; width:4px; border-radius:50%; background:var(--orange-ink) }
    .footer-right { display:flex; align-items:center; gap:18px }
    .footer button { color:var(--muted); font-size:10px; min-height:28px }
    .footer button:hover { color:var(--blue) }
    .space-heading { display:flex; align-items:flex-start; justify-content:space-between; gap:28px }
    .space-heading h1 { font-size:42px; letter-spacing:-2px; line-height:1.4 }
    .space-heading p { margin-top:9px; font-size:13px; color:var(--muted) }
    .drive-label { display:flex; gap:10px; align-items:center; min-height:42px; margin-top:9px; font-size:12px; color:var(--muted) }
    .drive-label .drive-letter { width:33px; height:37px; display:flex; align-items:center; justify-content:center; font-size:15px; color:var(--ink); border:1px solid var(--line); border-radius:7px; background:var(--surface) }
    .drive-label strong { display:block; color:var(--ink); font-size:12px; margin-bottom:4px; font-weight:500 }
    .space-landscape { position:relative; margin:8px -8px 0; min-height:270px }
    .landscape-svg { width:100%; height:auto; display:block; overflow:visible }
    .landscape-svg .fin { transition:transform 260ms var(--ease),opacity 260ms var(--ease) }
    .landscape-svg .land-group:hover .fin { transform:translateY(-6px) }
    .landscape-svg .land-group { cursor:pointer }
    .landscape-svg .land-group:focus-visible { outline:none }
    .landscape-svg .land-group:focus-visible .region-floor { stroke:var(--blue); stroke-width:3 }
    .free-space { position:absolute; left:73.8%; top:23%; color:var(--ink); pointer-events:none }
    .free-space .free-label { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:8px; margin-bottom:11px }
    .free-space .free-label::before { content:""; width:6px; height:6px; border:1px solid var(--muted); border-radius:50% }
    .free-space strong { font-family:"Segoe UI Variable Display","Segoe UI",sans-serif; font-size:clamp(47px,5.6vw,78px); font-weight:300; letter-spacing:-3px; line-height:1 }
    .free-space em { font-style:normal; font-size:15px; color:var(--muted); margin-left:7px }
    .free-space p { margin-top:12px; font-size:11px; color:var(--muted) }
    .map-legend { display:grid; grid-template-columns:29.1fr 23.4fr 13fr 34.5fr; margin:0 4.2% 0 3.2%; gap:12px; align-items:start }
    .legend-item { display:flex; align-items:flex-start; gap:8px; text-align:left; padding:9px 0; color:var(--muted); font-size:12px; min-height:44px }
    .legend-item i { width:8px; height:8px; display:block; margin-top:5px; background:var(--swatch); flex-shrink:0 }
    .legend-item strong { font-size:13px; color:var(--ink); font-weight:550; display:block; margin-bottom:6px }
    .legend-item:hover strong { color:var(--blue) }
    .legend-last { padding-left:9px; font-size:11px; color:var(--muted); padding-top:10px; line-height:1.7 }
    .home-console { display:grid; grid-template-columns:minmax(0,1fr) 366px; margin-top:23px; border-top:1px solid var(--line); padding-top:22px; gap:34px; align-items:center }
    .home-assurance { display:flex; align-items:flex-start; gap:13px; font-size:13px }
    .home-assurance>.icon { color:var(--blue); width:20px; height:20px; margin-top:3px }
    .home-assurance h2 { font-size:14px; margin-bottom:6px; font-weight:550 }
    .home-assurance p { font-size:12px; color:var(--muted); line-height:1.8 }
    .home-assurance .text-button { font-size:12px; min-height:28px }
    .scan-console { display:flex; align-items:center; gap:16px; padding:10px 10px 10px 19px; background:var(--ink); color:var(--surface); border-radius:13px; min-height:79px }
    .scan-console>div { flex:1; min-width:0 }
    .scan-console strong { font-size:13px; font-weight:500; display:block; margin-bottom:6px }
    .scan-console small { font-size:10px; opacity:.7 }
    .scan-console .button { min-height:56px; background:var(--apricot); color:#252222; border:0; padding:10px 19px; border-radius:8px; min-width:134px; font-size:15px; font-weight:550 }
    .scan-console .button:hover { background:#fac7a5 }
    .review-layout { display:grid; grid-template-columns:minmax(0,1fr) 254px; gap:30px; align-items:start }
    .review-main { min-width:0 }
    .stage-head { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:28px }
    .stage-head h1 { font-size:31px; font-weight:500; margin:10px 0 8px }
    .stage-head p { font-size:12px; color:var(--muted) }
    .stage-title { display:flex; align-items:center; gap:8px }
    .found-total { text-align:right; padding-top:18px; flex-shrink:0 }
    .found-total strong { display:block; color:var(--ink); font-size:32px; font-weight:400; letter-spacing:-1px }
    .found-total small { font-size:11px; color:var(--muted) }
    .filter-bar { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:12px }
    .filters { display:flex; flex-wrap:wrap; gap:2px; align-items:center }
    .filter { border:1px solid transparent; padding:8px 10px; min-height:36px; border-radius:6px; color:var(--muted); font-size:12px }
    .filter:hover { background:var(--soft) }
    .filter[aria-pressed="true"] { border-color:var(--line); color:var(--ink); background:var(--surface); font-weight:550 }
    .filter .count { font-size:10px; margin-left:5px; color:var(--muted) }
    .filter-bar>.text-button { font-size:11px }
    .result-list { border-top:1px solid var(--line) }
    .result-row { display:grid; grid-template-columns:23px 32px minmax(0,1fr) 76px; gap:12px; padding:19px 0; min-height:107px; align-items:center; border-bottom:1px solid var(--line) }
    .check-hit { display:flex; align-items:center; justify-content:center; min-width:23px; min-height:36px; cursor:pointer }
    input[type="checkbox"] { appearance:auto; accent-color:var(--blue); width:17px; height:17px; margin:0; cursor:pointer; flex-shrink:0 }
    .app-tile { width:32px; height:34px; display:flex; align-items:center; justify-content:center; color:var(--blue); background:var(--blue-soft); border-radius:7px }
    .app-tile .icon { width:18px; height:18px }
    .app-tile.warm { color:var(--orange-ink); background:color-mix(in srgb,var(--apricot) 20%,var(--surface)) }
    .app-tile.quiet { color:var(--muted); background:var(--soft) }
    .result-name { display:flex; align-items:center; flex-wrap:wrap; gap:7px }
    .result-name strong { font-size:14px; font-weight:550 }
    .result-description { color:var(--muted); font-size:12px; margin-top:6px; line-height:1.6 }
    .result-amount { font-size:16px; font-weight:500; text-align:right }
    .result-amount small { display:block; color:var(--muted); font-size:10px; font-weight:400; margin-top:6px }
    .row-detail { grid-column:3/5; justify-self:start; display:flex; align-items:center; gap:4px; color:var(--blue); font-size:12px; margin-top:-8px; min-height:28px; padding:2px 0 }
    .row-detail .icon { width:13px; height:13px }
    .row-detail:hover { text-decoration:underline }
    #review-aside { position:sticky; top:16px; padding-top:3px }
    .task-dock { flex-shrink:0; border-top:1px solid var(--line); background:var(--surface); display:flex; align-items:center; justify-content:space-between; padding:15px 44px; gap:20px }
    .dock-info { display:flex; align-items:center; gap:12px }
    .dock-info>.icon { color:var(--blue); width:23px; height:23px }
    .dock-info strong { font-weight:550; font-size:14px }
    .dock-info small { display:block; font-size:11px; color:var(--muted); margin-top:5px }
    .dock-actions { display:flex; align-items:center; gap:15px }
    .cleanup-ticket { position:relative; padding:24px 22px; display:block; border:0; border-radius:13px 13px 8px 8px; background:var(--ticket); color:var(--ticket-ink); overflow:visible }
    .cleanup-ticket::before,.cleanup-ticket::after { content:""; width:18px; height:18px; background:var(--bg); border-radius:50%; position:absolute; top:244px; left:-9px }
    .cleanup-ticket::after { left:auto; right:-9px }
    .ticket-caption { display:flex; align-items:center; justify-content:space-between; font-size:12px; opacity:.9; padding-bottom:22px; border-bottom:1px solid #ffffff38 }
    .ticket-caption .icon { width:17px; height:17px }
    .ticket-amount { font-family:"Segoe UI Variable Display","Segoe UI",sans-serif; font-size:49px; font-weight:350; line-height:1.2; letter-spacing:-1.7px; margin:23px 0 8px }
    .ticket-note { font-size:11px; color:#e0e5ff; line-height:1.8 }
    .ticket-stats { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:19px 0; margin-top:17px; border-top:1px dashed #ffffff59; border-bottom:1px dashed #ffffff59; font-size:11px; color:#e0e5ff }
    .ticket-stats strong { font-size:15px; color:white; font-weight:450 }
    .cleanup-ticket .ticket-action { display:flex; width:100%; margin-top:25px; justify-content:space-between; background:var(--apricot); color:#252222; border:0; font-weight:550; min-height:47px }
    .cleanup-ticket .ticket-action:hover { background:#fac7a5 }
    .ticket-secondary { color:#e0e5ff; width:100%; font-size:11px; padding:14px 0 0; min-height:35px; text-align:center }
    .ticket-secondary:hover { text-decoration:underline }
    .ticket-footer { color:var(--muted); font-size:11px; line-height:1.8; padding:19px 9px 0; display:flex; gap:8px; align-items:flex-start }
    .ticket-footer .icon { width:15px; height:15px; margin-top:3px; flex-shrink:0 }
    .inline-notice { display:flex; gap:9px; align-items:flex-start; padding:13px 15px; background:var(--soft); border-radius:7px; color:var(--muted); font-size:12px; line-height:1.8; margin:15px 0 }
    .inline-notice .icon { width:17px; height:17px; flex-shrink:0; margin-top:2px }
    .progress-header { display:flex; align-items:flex-start; justify-content:space-between; gap:30px; margin-bottom:5px }
    .progress-header h1 { font-size:35px; margin:14px 0 9px }
    .progress-header p { font-size:13px; color:var(--muted) }
    .progress-reading { text-align:right; padding-top:36px }
    .progress-reading strong { font-size:43px; font-weight:350; letter-spacing:-1px }
    .progress-reading small { color:var(--muted); font-size:12px; display:block; margin-top:6px }
    .progress-caption { display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--line); padding-top:18px; gap:16px; font-size:12px; color:var(--muted) }
    .live-dot { width:6px; height:6px; background:var(--blue); display:inline-block; border-radius:50%; margin-right:8px }
    [data-stage="scanning"] .landscape-svg .land-group:nth-of-type(2) .fin { animation:find-space 1.8s var(--ease) 2 }
    @keyframes find-space { 0%,100% {transform:none} 50% {transform:translateY(-9px)} }
    .complete-head { display:grid; grid-template-columns:1fr auto; gap:30px; align-items:center; padding:9px 0 20px }
    .complete-head h1 { font-size:40px; margin:15px 0 10px }
    .complete-head p { font-size:13px; color:var(--muted) }
    .freed-readout { font-size:65px; color:var(--blue); font-weight:300; font-family:"Segoe UI",sans-serif; letter-spacing:-3px }
    .freed-readout small { color:var(--muted); display:block; font-size:12px; letter-spacing:0; text-align:right; margin-bottom:8px }
    .complete-footer { display:flex; align-items:center; justify-content:space-between; gap:24px; border-top:1px solid var(--line); padding-top:22px }
    .complete-footer p { font-size:12px; color:var(--muted) }
    .complete-head + .space-landscape { min-height:0 }
    .complete-head + .space-landscape .landscape-svg { height:200px }
    .complete-head + .space-landscape .free-space strong { font-size:49px }
    .button-row { display:flex; gap:10px; align-items:center; flex-wrap:wrap }
    .analysis-top { display:flex; gap:24px; align-items:center; justify-content:space-between; margin-bottom:24px }
    .analysis-top p { font-size:13px; color:var(--muted); margin-top:9px }
    .analysis-disk { display:flex; justify-content:space-between; padding-bottom:20px; border-bottom:1px solid var(--line); align-items:center; gap:25px }
    .analysis-disk .drive-label { margin:0 }
    .analysis-capacity { display:flex; gap:30px; align-items:baseline; font-size:12px; color:var(--muted) }
    .analysis-capacity strong { font-size:24px; color:var(--ink); font-weight:400; margin-right:5px }
    .analysis-map { margin-top:13px }
    .analysis-map .space-landscape { min-height:0; margin-top:-18px; max-height:250px; overflow:hidden }
    .analysis-map .landscape-svg { height:250px; }
    .analysis-map .free-space { top:27%; left:76% }
    .analysis-map .free-space strong { font-size:48px }
    .analysis-map .free-space p { display:none }
    .analysis-map .map-legend { display:none }
    .analysis-controls { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; margin:12px 0 17px }
    .search-box { display:flex; position:relative; align-items:center; min-width:0 }
    .search-box>.icon { position:absolute; left:12px; width:16px; height:16px; color:var(--muted) }
    input[type="search"] { min-height:40px; border:1px solid var(--line); border-radius:7px; background:var(--surface); color:var(--ink); width:100%; min-width:0; padding:9px 12px 9px 37px; font-size:12px }
    input::placeholder { color:var(--muted); opacity:1 }
    .analysis-search { width:220px }
    .ranking { border-top:1px solid var(--line) }
    .rank-row { display:grid; grid-template-columns:25px minmax(0,1fr) 85px 35px; gap:15px; align-items:center; padding:15px 0; border-bottom:1px solid var(--line); min-height:87px }
    .rank-order { font-size:11px; color:var(--muted) }
    .rank-title { display:flex; justify-content:space-between; gap:12px; align-items:center; font-size:14px; font-weight:500 }
    .rank-path { color:var(--muted); font-size:11px; margin:6px 0 10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
    .rank-bar { height:3px; background:var(--soft); overflow:hidden }
    .rank-bar span { display:block; height:100%; background:var(--blue); opacity:.6 }
    .rank-size { font-size:17px; font-weight:400; text-align:right }
    .rank-open { color:var(--blue); min-height:40px; display:flex; align-items:center; justify-content:center }
    .rank-open:hover { background:var(--blue-soft); border-radius:7px }
    .ranking-note { font-size:11px; color:var(--muted); margin-top:15px }
    .empty { text-align:center; padding:46px 20px; color:var(--muted); font-size:13px }
    .empty h2 { margin-bottom:13px; font-size:20px; color:var(--ink) }
    .history-intro { display:flex; align-items:baseline; gap:15px; padding:6px 0 25px; margin-bottom:27px }
    .history-intro strong { color:var(--blue); font-family:"Segoe UI",sans-serif; font-size:47px; font-weight:300; letter-spacing:-1.5px }
    .history-intro span { font-size:12px; color:var(--muted) }
    .history-day { display:grid; grid-template-columns:100px 1fr; gap:27px; margin-bottom:27px }
    .history-date { padding:20px 0; color:var(--muted); font-family:"Segoe UI",sans-serif; font-size:11px }
    .history-date strong { display:block; font-size:22px; color:var(--ink); font-weight:400; margin-bottom:6px }

<body>
  <a class="skip" href="#workspace">跳到主要内容</a>
  <div class="app">
    <header class="topbar">
      <div class="brand" aria-label="拂尘">
        <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true"><path d="M4 10c10-9 24-4 29 5M4 18c10-9 24-4 29 5M4 26c10-9 24-4 29 5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
        <div><div class="brand-name">拂尘</div><div class="brand-note">DUSTAWAY / EBB</div></div>
      </div>
      <nav class="navigation" aria-label="主导航">
        <button class="nav-button" data-nav="clean" aria-current="page"><span class="nav-index" aria-hidden="true">01</span>清理</button>
        <button class="nav-button" data-nav="analysis"><span class="nav-index" aria-hidden="true">02</span>空间分析</button>
        <button class="nav-button" data-nav="history"><span class="nav-index" aria-hidden="true">03</span>历史</button>
        <button class="nav-button" data-nav="settings"><span class="nav-index" aria-hidden="true">04</span>设置</button>
      </nav>
      <div class="top-actions"><span class="local-label"><i></i>LOCAL / C:</span><button id="theme-toggle" class="icon-button" data-action="toggle-theme" aria-label="切换为深色"></button></div>
    </header>
    <main class="workspace" id="workspace" tabindex="-1">
      <section id="page-clean" class="page" aria-label="清理"></section>
      <section id="page-analysis" class="page" aria-label="空间分析" hidden></section>
      <section id="page-history" class="page" aria-label="历史" hidden></section>
      <section id="page-settings" class="page" aria-label="设置" hidden></section>
    </main>
    <div id="task-dock" class="task-dock" hidden></div>
    <footer class="footer"><span class="prototype-mark"><i></i>交互原型 · 模拟数据</span><div class="footer-right"><button id="background-task" data-action="return-task" hidden></button><span>不会读取或删除电脑文件</span><a href="./restored.html" target="_blank" rel="noopener">原版对照</a><button data-action="reset">重置演示</button></div></footer>
  </div>
  <dialog id="modal" aria-labelledby="modal-title"></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <div id="announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <script>
    'use strict';
    const $ = (id) => document.getElementById(id);
    const MiB = 1024 * 1024, GiB = 1024 * MiB;
    const esc = (value) => String(value).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const icons = {
      arrow:'<path d="M4 12h15m-6-6 6 6-6 6"/>',
      chevron:'<path d="m9 5 7 7-7 7"/>',
      down:'<path d="m6 9 6 6 6-6"/>',
      close:'<path d="m6 6 12 12M6 18 18 6"/>',
      sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/>',
      moon:'<path d="M20.7 13a9 9 0 0 1-9.7-9.7A9 9 0 1 0 20.7 13Z"/>',
      scan:'<path d="M8 3H4a1 1 0 0 0-1 1v4m13-5h4a1 1 0 0 1 1 1v4M3 16v4a1 1 0 0 0 1 1h4m8 0h4a1 1 0 0 0 1-1v-4M5 12h14"/>',
      shield:'<path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6Z"/><path d="m8 12 3 3 5-6"/>',
      disk:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 13h18m-5 3h2"/>',
      folder:'<path d="M3 8V6a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/><path d="M3 10h18"/>',
      globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c5 5 5 13 0 18-5-5-5-13 0-18Z"/>',
      window:'<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M9 9v12"/>',
      image:'<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m21 16-5-6L7 21"/>',
      file:'<path d="M14 3H5v18h14V8Z"/><path d="M14 3v5h5M8 13h8m-8 4h5"/>',
      lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/>',
      check:'<path d="m5 12 4 4L19 6"/>',
      info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.1"/>',
      search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',
      refresh:'<path d="M20 7v5h-5M4 17v-5h5"/><path d="M5 7a8 8 0 0 1 14 0m0 10a8 8 0 0 1-14 0"/>',
      history:'<path d="M3 4v5h5"/><path d="M3.8 8A9 9 0 1 1 3 14m9-7v5l3 2"/>',
      archive:'<rect x="3" y="3" width="18" height="5" rx="1"/><path d="M5 8v13h14V8m-9 4h4"/>',
      stop:'<rect x="6" y="6" width="12" height="12" rx="2"/>',
      spark:'<path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Z"/>'
    };
    const icon = (name) => '<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">' + (icons[name] || icons.file) + '</svg>';
    function coastline(offset=0,close=false){
      const x=n=>n+offset;
      return 'M '+x(646)+' -20 C '+x(740)+' 97 '+x(636)+' 195 '+x(581)+' 272 C '+x(500)+' 386 '+x(586)+' 404 '+x(526)+' 482 C '+x(461)+' 565 '+x(355)+' 570 '+x(355)+' 670'+(close?' L 1500 670 L 1500 -20 Z':'');
    }
    function coastArt(){
      const shift=(freeBytes()/GiB-88.4)/256*1000;
      return '<div class="tide-canvas" aria-hidden="true"><svg viewBox="0 0 1000 650" preserveAspectRatio="none"><path class="coast-fill" d="'+coastline(shift,true)+'"/><path class="coast-depth" d="'+coastline(218+shift,true)+'"/>'+[24,49,88,142,218,319].map(n=>'<path class="coast-line" d="'+coastline(n+shift)+'"/>').join('')+'</svg></div>';
    }
    function levelPath(level,close=true){
      const y=Math.max(8,Math.min(230,level));
      return 'M 0 '+y+' C 160 '+(y-35)+' 330 '+(y+35)+' 500 '+y+' S 840 '+(y-35)+' 1000 '+y+(close?' V 260 H 0 Z':'');
    }
    function selectedRatio(){
      const total=sum(visibleGroups().filter(g=>g.kind!=='blocked').flatMap(remaining));
      return total?sum(selectedFiles())/total:0;
    }
    function tidePreview(){
      return '<svg viewBox="0 0 1000 260" preserveAspectRatio="none" role="img" aria-label="当前可清理示例中的已选比例"><path class="preview-base" d="'+levelPath(65)+'"/><path class="preview-selected" data-preview-tide d="'+levelPath(245-selectedRatio()*190)+'"/></svg>';
    }
    function tideProgress(){
      const start=state.tideStartFree??freeBytes(),planned=state.tidePlanned||0;
      return planned?Math.max(0,Math.min(1,(freeBytes()-start)/planned)):0;
    }
    function tideScene(stage){
      const free=freeBytes()/GiB,base=85+tideProgress()*110;
      const active=['cleaning','complete'].includes(stage),start=state.tideStartFree??freeBytes();
      const scale=active?'本次变化 / '+(start/GiB).toFixed(1)+' → '+((start+(state.tidePlanned||0))/GiB).toFixed(1)+' GB':'C: / 256 GB';
      return '<div class="tide-scene" data-stage="'+stage+'" role="img" aria-label="'+(active?'本次清理范围的放大示意，潮线随实际模拟释放退去':'扫描进度场景，空间占用尚未改变')+'"><svg viewBox="0 0 1000 260" preserveAspectRatio="none" aria-hidden="true"><path class="previous-level" data-previous-level d="'+levelPath(85,false)+'"/><path class="current-level" data-current-level d="'+levelPath(base)+'"/>'+[19,43,75,117].map(n=>'<path class="level-line" data-level-offset="'+n+'" d="'+levelPath(base+n,false)+'"/>').join('')+'<path class="tide-sweep" d="M -10 0 V 260"/></svg><div class="tide-scene-label">当前可用 <strong class="number" data-scene-free>'+free.toFixed(1)+'</strong>GB</div><div class="tide-scale">'+scale+'</div><div class="tide-scene-bottom"><span>'+(active?'本次已释放':'当前已用')+' <b class="number" data-scene-used>'+(active?bytes(freeBytes()-start):(256-free).toFixed(1)+' GB')+'</b></span><span>'+(stage==='complete'?'这一段留白，来自你的整理。':stage==='cleaning'?'潮线正在退去，文件按确认范围处理。':'扫描只检查文件，空间占用尚未改变。')+'</span></div></div>'+
        (stage==='scanning'?'<div class="fold-stepbar" aria-label="已检查的类别">'+groups.map(g=>'<span class="fold-step" data-scan-chip="'+g.id+'">'+({edge:'Edge 缓存',chrome:'Chrome 缓存',windows:'临时文件',thumb:'缩略图',reports:'诊断报告',wechat:'应用日志'}[g.id])+'</span>').join('')+'</div>':'')+
        (['scanning','cleaning'].includes(stage)?'<div class="journey-track" id="journey-progress" role="progressbar" aria-label="模拟任务进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="journey-fill"></span></div>':'');
    }
    function syncTide(){
      const selected=sum(selectedFiles()),free=freeBytes()/GiB,level=85+tideProgress()*110;
      document.querySelectorAll('[data-preview-tide]').forEach(p=>{p.setAttribute('d',levelPath(245-selectedRatio()*190));p.dataset.previewBytes=selected;});
      document.querySelectorAll('[data-current-level]').forEach(p=>{p.setAttribute('d',levelPath(level));p.dataset.freeBytes=freeBytes();});
      document.querySelectorAll('[data-previous-level]').forEach(p=>p.setAttribute('d',levelPath(85,false)));
      document.querySelectorAll('[data-level-offset]').forEach(p=>p.setAttribute('d',levelPath(level+Number(p.dataset.levelOffset),false)));
      document.querySelectorAll('[data-scene-free]').forEach(p=>p.textContent=free.toFixed(1));
      document.querySelectorAll('[data-scene-used]').forEach(p=>p.textContent=['cleaning','complete'].includes(state.stage)?bytes(freeBytes()-(state.tideStartFree??freeBytes())):(256-free).toFixed(1)+' GB');
    }
    function renderHome(){
      const free=freeBytes()/GiB,removed=allFiles.filter(f=>state.deleted.has(f.id));

      clearInterval(state.scanTimer);state.scanTimer=null;state.stage='review';state.incomplete=stopped;
      visibleGroups().filter((g)=>g.kind==='recommended').flatMap(remaining).forEach((f)=>state.selected.add(f.id));
      renderClean();$('workspace').scrollTop=0;
      if(state.page==='clean') {
        const focus=$('prepare-cleanup');
        if(focus&&!focus.disabled) focus.focus({preventScroll:true});
        else $('page-clean').querySelector('button')?.focus({preventScroll:true});
      }
      announce(stopped?'模拟扫描已停止，已检查的结果已保留。':'模拟扫描完成，建议项已选择，可查看文件并调整。');
    }
    function startCleanup() {
      if(state.stage!=='review'||!state.pending.length) return;
      state.tideStartFree=freeBytes();state.tidePlanned=sum(allFiles.filter(f=>state.pending.includes(f.id)));state.stage='cleaning';state.processed=[];state.totalToClean=state.pending.length;
      closeModal();renderClean();setPage('clean');$('workspace').scrollTop=0;
      $('stop-task').focus({preventScroll:true});announce('开始模拟清理。');
      state.cleanupTimer=setInterval(()=>{
        const id=state.pending.shift();
        if(id) { state.deleted.add(id);state.selected.delete(id);state.processed.push(id); }
        updateJourney(state.processed.length/state.totalToClean*100);
        if($('cleanup-count')) $('cleanup-count').textContent=state.processed.length;
        if($('cleanup-bytes')) $('cleanup-bytes').textContent=bytes(sum(allFiles.filter((f)=>state.processed.includes(f.id))));
        if(!state.pending.length) finishCleanup(false);
      },350);
    }
    function finishCleanup(stopped) {
      clearInterval(state.cleanupTimer);state.cleanupTimer=null;
      const now=new Date(), files=allFiles.filter((f)=>state.processed.includes(f.id));
      const pad=(n)=>String(n).padStart(2,'0');
      const report={id:'demo-'+Date.now(),date:now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate()),time:pad(now.getHours())+':'+pad(now.getMinutes()),bytes:sum(files),count:files.length,scope:groups.filter((g)=>files.some((f)=>f.group===g.id)).map((g)=>g.name).join('、')||'尚未处理文件',stopped,sample:false};
      state.lastReport=report;state.history.unshift(report);state.stage='complete';state.pending=[];
      renderClean();if(state.page==='history')renderHistory();
      if(state.page==='clean') { $('workspace').scrollTop=0;$('page-clean').querySelector('.button')?.focus({preventScroll:true}); }
      announce((stopped?'模拟清理已停止。':'模拟清理完成。')+'本次处理 '+report.count+' 个示例文件，'+bytes(report.bytes)+'。');
    }
    function stopTask() { if(state.stage==='scanning')finishScan(true);else if(state.stage==='cleaning')finishCleanup(true); }
    let modalOpener=null;
    function openModal(content,side,description) {
      const modal=$('modal');
      if(modal.open) modal.close();
      modalOpener=document.activeElement;
      modal.className=side?'side-sheet':'';
      modal.innerHTML=content;
      if(description)modal.setAttribute('aria-describedby',description);else modal.removeAttribute('aria-describedby');
      modal.showModal();
      const first=modal.querySelector('[data-autofocus]')||modal.querySelector('[data-action="close-modal"]');
      first?.focus({preventScroll:true});
    }
    function closeModal() { $('modal').close(); }
    $('modal').addEventListener('close',()=>{
      state.dialogGroup=null;state.fileSearch='';
      const opener=modalOpener;modalOpener=null;
      if(opener?.isConnected)opener.focus({preventScroll:true});
    });
    $('modal').addEventListener('click',(event)=>{
      if(event.target!==$('modal'))return;
      const r=$('modal').getBoundingClientRect();
      if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom) closeModal();
    });
    $('modal').addEventListener('keydown',(event)=>{
      if(event.key!=='Tab')return;
      const modal=$('modal');
      const focusable=[...modal.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),a[href],[tabindex]:not([tabindex="-1"])')].filter((el)=>el.getClientRects().length);
      const first=focusable[0],last=focusable[focusable.length-1];
      if(!first) { event.preventDefault();return; }
      if(event.shiftKey&&(document.activeElement===first||!modal.contains(document.activeElement))) {
        event.preventDefault();last.focus();
      } else if(!event.shiftKey&&(document.activeElement===last||!modal.contains(document.activeElement))) {
        event.preventDefault();first.focus();
      }
    });
    function modalHeader(title,sub) { return '<div class="dialog-header"><div><h2 id="modal-title">'+title+'</h2>'+(sub?'<p>'+sub+'</p>':'')+'</div><button class="icon-button" data-action="close-modal" aria-label="关闭弹窗">'+icon('close')+'</button></div>'; }
    function fileMatches(g) { const q=state.fileSearch.trim().toLowerCase();return remaining(g).filter((f)=>(f.name+' '+f.path).toLowerCase().includes(q)); }
    function openFiles(id) {
      const g=groups.find((g)=>g.id===id);if(!g)return;
      state.dialogGroup=id;state.fileSearch='';
      openModal(modalHeader(g.name,kindName(g)+' · 示例文件明细')+
        '<div class="sheet-toolbar"><label class="search-box">'+icon('search')+'<input type="search" id="file-search" aria-label="搜索示例文件名或路径" placeholder="搜索文件名或路径"></label><div class="file-select-all">'+(g.kind==='blocked'?'<span>'+icon('lock')+' 此类项目不可选择</span>':'<label><input type="checkbox" id="file-all">选择当前结果</label>')+'<span id="file-count"></span></div></div>' +
        '<div class="dialog-body" style="flex:1"><p style="font-size:12px">'+esc(g.desc)+'</p><div id="file-list"></div></div><div class="dialog-actions"><span id="file-selection" class="dialog-selection"></span><button class="button primary" data-action="close-modal">完成查看</button></div>',true);
      state.dialogGroup=id;
      renderFiles();
    }
    function renderFiles() {
      const g=groups.find((g)=>g.id===state.dialogGroup);if(!g)return;
      const files=fileMatches(g);
      $('file-count').textContent=files.length+' 项';
      $('file-list').innerHTML=files.length?files.map((f)=>'<div class="file-row">'+
        (g.kind==='blocked'?'<span class="muted">'+icon('lock')+'</span>':'<label class="check-hit"><input type="checkbox" data-file-check="'+f.id+'" aria-label="选择 '+esc(f.name)+'" '+(state.selected.has(f.id)?'checked':'')+'></label>')+
        '<div><strong>'+esc(f.name)+'</strong><p class="file-path">'+esc(f.path)+'</p><small>示例文件 · 12 天前修改</small></div><span class="number">'+bytes(f.bytes)+'</span></div>').join(''):'<div class="empty"><h2>没有匹配的文件</h2><p>试试其他文件名，或清空搜索。</p></div>';
      updateChecks();
    }
    function prepareCleanup() {
      const files=selectedFiles();if(state.stage!=='review'||!files.length)return;
      state.pending=files.map((f)=>f.id);
      openModal(modalHeader('确认清理这些项目？','你可以随时返回，继续调整选择。')+
        '<div class="dialog-body"><div class="confirm-total number">'+bytes(sum(files))+'</div><p>'+files.length+' 个示例文件已选择</p><ul class="confirm-list">'+
        groups.filter((g)=>files.some((f)=>f.group===g.id)).map((g)=>'<li><span>'+g.name+'</span><span class="number">'+bytes(sum(files.filter((f)=>f.group===g.id)))+'</span></li>').join('')+
        '</ul><p class="danger-note" id="confirm-description">正式软件中的清理为永久删除，不进入回收站。当前为交互原型，确认后仅模拟处理，不会删除电脑上的文件。</p></div>'+
        '<div class="dialog-actions"><button class="button" data-action="close-modal" data-autofocus>返回检查</button><button class="button primary" data-action="execute">确认模拟清理</button></div>',false,'confirm-description');
    }
    function showScope() {
      openModal(modalHeader('本次检查范围','以下类别用于演示清理流程。')+'<div class="dialog-body"><p>实际软件以本机识别结果为准。原型不会检查已安装的软件，也不会读取文件。</p><ul class="confirm-list">'+groups.map((g)=>'<li><span>'+g.name+'</span><span class="tag '+(g.kind==='review'?'warm':'')+'">'+kindName(g)+'</span></li>').join('')+'</ul><div class="inline-notice">'+icon('shield')+'文档、照片、下载内容、密码和聊天内容均不进入本次模拟清理。</div></div><div class="dialog-actions"><button class="button primary" data-action="close-modal">知道了</button></div>',false);
    }

    function renderAnalysis() {
      $('page-analysis').innerHTML='<div class="analysis-top"><div><span class="page-kicker">02 / SPACE ATLAS</span><h1>每一处占用，都有来处。</h1><p>每一份占用，都有自己的去处。</p></div><button id="analyze-button" class="button" data-action="analyze" '+(state.analysisBusy?'disabled':'')+'>'+icon('refresh')+(state.analysisBusy?'正在模拟分析…':'重新分析')+'</button></div>'+
        '<div class="analysis-disk"><div class="drive-label"><span class="drive-letter number">C:</span><span><strong>系统磁盘</strong>本地固定磁盘 · 示例</span></div><div class="analysis-capacity"><span><strong class="number">256</strong>GB 总容量</span><span><strong class="number">'+(freeBytes()/GiB).toFixed(1)+'</strong>GB 可用</span></div></div>'+
        '<div class="analysis-map">'+sculpture('analysis')+'</div>'+
        '<div class="analysis-controls"><div class="filters" aria-label="按用途筛选">'+[['all','全部'],['apps','应用'],['personal','个人文件'],['system','系统']].map((f)=>'<button class="filter" data-analysis-filter="'+f[0]+'" aria-pressed="'+(state.analysisFilter===f[0])+'">'+f[1]+'</button>').join('')+'</div><label class="search-box analysis-search">'+icon('search')+'<input type="search" id="analysis-search" aria-label="搜索目录或路径" placeholder="搜索目录或路径" value="'+esc(state.analysisSearch)+'"></label></div><div id="analysis-status" class="inline-notice" '+(!state.analysisBusy&&!state.analysisHasRun?'hidden':'')+' role="status">'+icon('info')+(state.analysisBusy?'正在模拟读取示例目录，当前列表仍可查看。':'示例分析已更新。没有读取你的电脑文件。')+'</div><div id="ranking" class="ranking"></div><p class="ranking-note">按示例大小排序 · 条带相对当前结果最大项 · 空间分析不会删除文件</p>';
      renderRanking();
    }
    function renderRanking() {
      const q=state.analysisSearch.trim().toLowerCase();
      const rows=analysisItems.filter((item)=>(state.analysisFilter==='all'||item.type===state.analysisFilter)&&(item.name+' '+item.path).toLowerCase().includes(q));
      $('ranking').innerHTML=rows.length?rows.map((item,i)=>'<article class="rank-row"><span class="rank-order number">'+String(i+1).padStart(2,'0')+'</span><div style="min-width:0"><div class="rank-title"><span>'+item.name+'</span><span class="tag">'+item.label+'</span></div><div class="rank-path" title="'+esc(item.path)+'">'+esc(item.path)+'</div><div class="rank-bar" aria-hidden="true"><span style="width:'+(item.bytes/rows[0].bytes*100)+'%"></span></div></div><span class="rank-size number">'+bytes(item.bytes)+'</span><button id="rank-detail-'+analysisItems.indexOf(item)+'" class="rank-open" data-analysis-detail="'+analysisItems.indexOf(item)+'" aria-label="查看'+item.name+'处理建议">'+icon('chevron')+'</button></article>').join(''):'<div class="empty"><h2>没有匹配的目录</h2><p>试试其他关键词，或切换用途筛选。</p><button class="text-button" data-action="clear-analysis">清空筛选</button></div>';
    }
    function openAnalysisDetail(index) {
      const item=analysisItems[index];if(!item)return;
      openModal(modalHeader(item.name,'空间分析 · 只读示例')+'<div class="dialog-body"><span class="tag">'+item.label+'</span><div class="confirm-total number" style="margin-top:15px">'+bytes(item.bytes)+'</div><p class="detail-path">'+esc(item.path)+'</p><h3>可以怎样整理</h3><p style="margin-top:13px">'+item.advice+'</p><ul class="advice-list">'+item.tips.map((t)=>'<li>'+t+'</li>').join('')+'</ul><div class="inline-notice">'+icon('shield')+'此面板用于查看建议，不提供直接删除目录的操作。</div></div><div class="dialog-actions">'+(index===6?'<button class="button primary" data-action="go-clean">前往清理</button>':'<button class="button primary" data-action="close-modal">返回排行</button>')+'</div>',true);
    }
    function runAnalysis() {
      if(state.analysisBusy)return;
      state.analysisBusy=true;renderAnalysis();announce('开始模拟空间分析。');
      state.analysisTimer=setTimeout(()=>{
        state.analysisBusy=false;state.analysisHasRun=true;
        if(state.page==='analysis') { renderAnalysis();$('analyze-button').focus({preventScroll:true}); }
        announce('模拟空间分析完成。');
      },1600);
    }
    function renderHistory() {
      const total=state.history.reduce((n,r)=>n+r.bytes,0),dates=[...new Set(state.history.map((r)=>r.date))];
      $('page-history').innerHTML='<div class="page-head"><div><span class="page-kicker">03 / TIDE RECORDS</span><h1>每次退潮，都留下刻度。</h1><p>每一份释放的空间，都有据可查。</p></div><button class="button" data-action="clear-history" '+(!state.history.length?'disabled':'')+'>清空记录</button></div>'+
        (state.history.length?'<div class="history-intro"><strong class="number">'+bytes(total)+'</strong><span>'+state.history.length+' 次演示记录中的处理总量</span></div>'+dates.map((date)=>'<section class="history-day"><div class="history-date"><strong>'+date.slice(5).replace('-',' / ')+'</strong>'+date.slice(0,4)+'</div><div>'+state.history.filter((r)=>r.date===date).map((r)=>'<details class="history-receipt"><summary><span class="receipt-icon">'+icon(r.stopped?'stop':'check')+'</span><div><strong>'+(r.stopped?'停止后保留未处理项目':'清理完成')+'</strong><small>'+r.time+' · '+r.count.toLocaleString('zh-CN')+' 个文件 · '+(r.sample?'示例记录':'本次演示')+'</small></div><span class="number">'+bytes(r.bytes)+'</span>'+icon('down')+'</summary><div class="receipt-detail"><p>处理范围：'+esc(r.scope)+'</p><p>'+(r.stopped?'任务已停止，尚未处理的示例文件仍保留。':'仅处理当次选中的示例项目。')+'</p><p>模拟记录，不代表你的电脑发生过实际清理。</p></div></details>').join('')+'</div></section>').join(''):'<div class="empty">'+icon('history')+'<h2 style="margin-top:18px">这里，还留着空白。</h2><p>完成一次模拟清理后，记录会出现在这里。</p><button class="button primary" data-nav="clean" style="margin-top:24px">去清理</button></div>');
    }
    function renderSettings() {
      $('page-settings').innerHTML='<div class="page-head"><div><span class="page-kicker">04 / YOUR RHYTHM</span><h1>按你的节奏，慢慢来。</h1><p>外观、动效，以及不想打扰的文件。</p></div></div><div class="settings-grid"><div><section class="settings-section"><h2>界面外观</h2><p>换一种光线，不打断正在进行的整理。</p><div class="theme-options">'+[['light','浅色',''],['dark','深色','dark-preview'],['system','跟随系统','system-preview']].map((t)=>'<button class="theme-choice" data-theme-choice="'+t[0]+'" aria-pressed="'+(state.theme===t[0])+'"><div class="theme-preview '+t[2]+'" aria-hidden="true"></div><span class="theme-name">'+t[1]+icon('check')+'</span></button>').join('')+'</div></section><section class="settings-section"><div class="setting-row"><label for="reduce-motion"><strong>减少动效</strong><small>关闭潮线过渡与扫描光线，直接呈现状态。<br>系统已减少动效时，这里也会自动尊重设置。</small></label><input type="checkbox" id="reduce-motion" '+(state.motion?'checked':'')+'></div></section><div class="about-note"><strong>拂尘 · 交互原型</strong><br>所有数据均为示例，调整仅在当前页面会话内生效。<br>关闭或刷新页面后，演示会恢复初始状态。</div></div><section class="exclusion-panel"><h2>'+icon('shield')+'安心保留</h2><p>以下位置始终保留。这个原型仅展示保留清单。</p><ul class="exclusion-list"><li>'+icon('folder')+'<div>文档与工作文件<small>C:\\Users\\Demo\\Documents</small></div></li><li>'+icon('image')+'<div>照片与视频<small>C:\\Users\\Demo\\Pictures</small></div></li><li>'+icon('lock')+'<div>密码与聊天内容<small>不进入模拟清理范围</small></div></li></ul><p style="margin-top:5px">保留什么，始终由你决定。</p></section></div>';
    }
    function askClearHistory() {
      openModal(modalHeader('清空演示记录？','只影响当前原型中的历史列表。')+'<div class="dialog-body"><p>清空后可以重新体验清理，生成新的演示记录。不会影响电脑上的任何数据。</p></div><div class="dialog-actions"><button class="button" data-action="close-modal" data-autofocus>保留记录</button><button class="button primary" data-action="confirm-clear-history">清空演示记录</button></div>',false);
    }
    function resetDemo() {
      clearInterval(state.scanTimer);clearInterval(state.cleanupTimer);clearTimeout(state.analysisTimer);
      if($('modal').open)closeModal();
      state.tideStartFree=null;state.tidePlanned=0;state.stage='idle';state.selected.clear();state.deleted.clear();state.scannedGroups=[];state.pending=[];state.processed=[];state.lastReport=null;state.incomplete=false;
      state.filter='all';state.history=initialHistory();state.analysisBusy=false;state.analysisHasRun=false;state.analysisSearch='';state.analysisFilter='all';state.scroll={};
      renderClean();setPage('clean');$('workspace').scrollTop=0;$('start-scan').focus({preventScroll:true});toast('已重置演示数据，外观设置继续保留。');
    }
    document.addEventListener('click',(event)=>{
      const region=event.target.closest('[data-map]');
      if(region) {
        state.analysisFilter=region.dataset.map;state.analysisSearch='';
        setPage('analysis');$('workspace').scrollTop=0;
        document.querySelector('[data-analysis-filter="'+state.analysisFilter+'"]')?.focus({preventScroll:true});
        announce('已显示'+({apps:'应用',personal:'个人文件',system:'系统'}[state.analysisFilter])+'占用。');
        return;
      }
      const el=event.target.closest('button');if(!el||el.disabled)return;
      el.focus({preventScroll:true});
      if(el.dataset.nav) { setPage(el.dataset.nav);return; }
      if(el.dataset.filter) {
        state.filter=el.dataset.filter;
        document.querySelectorAll('[data-filter]').forEach((b)=>b.setAttribute('aria-pressed',String(b.dataset.filter===state.filter)));
        renderRows();return;
      }
      if(el.dataset.detail) { openFiles(el.dataset.detail);return; }
      if(el.dataset.analysisFilter) {
        state.analysisFilter=el.dataset.analysisFilter;
        document.querySelectorAll('[data-analysis-filter]').forEach((b)=>b.setAttribute('aria-pressed',String(b.dataset.analysisFilter===state.analysisFilter)));
        renderRanking();return;
      }
      if(el.dataset.analysisDetail!==undefined) { openAnalysisDetail(Number(el.dataset.analysisDetail));return; }
      if(el.dataset.themeChoice) { state.theme=el.dataset.themeChoice;applyTheme();announce('外观已切换。');return; }
      switch(el.dataset.action) {
        case 'scan': startScan();break;
        case 'stop': stopTask();break;
        case 'prepare': prepareCleanup();break;
        case 'execute': startCleanup();break;
        case 'close-modal': closeModal();break;
        case 'scope': showScope();break;
        case 'toggle-theme': state.theme=effectiveTheme()==='light'?'dark':'light';applyTheme();break;
        case 'recommended':
          state.selected.clear();visibleGroups().filter((g)=>g.kind==='recommended').flatMap(remaining).forEach((f)=>state.selected.add(f.id));
          updateChecks();announce('已只选择建议项，共 '+selectedFiles().length+' 个示例文件。');break;
        case 'analyze': runAnalysis();break;
        case 'clear-analysis': state.analysisSearch='';state.analysisFilter='all';renderAnalysis();$('analysis-search').focus();break;
        case 'clear-history': askClearHistory();break;
        case 'confirm-clear-history': state.history=[];closeModal();renderHistory();$('page-history').querySelector('[data-nav="clean"]').focus({preventScroll:true});toast('演示记录已清空。');break;
        case 'go-clean': closeModal();setPage('clean');break;
        case 'return-task': setPage('clean');break;
        case 'reset': resetDemo();break;
      }
    });
    document.addEventListener('change',(event)=>{
      const input=event.target;
      if(input.dataset.groupCheck) {
        const g=groups.find((g)=>g.id===input.dataset.groupCheck);
        if(g.kind==='blocked')return;
        remaining(g).forEach((f)=>input.checked?state.selected.add(f.id):state.selected.delete(f.id));updateChecks();
        announce('已选 '+selectedFiles().length+' 个示例文件，共 '+bytes(sum(selectedFiles()))+'。');
      }
      if(input.dataset.fileCheck) {
        const f=allFiles.find((f)=>f.id===input.dataset.fileCheck);
        if(groups.find((g)=>g.id===f.group).kind==='blocked')return;
        input.checked?state.selected.add(f.id):state.selected.delete(f.id);updateChecks();
      }
      if(input.id==='file-all'&&state.dialogGroup) {
        const g=groups.find((g)=>g.id===state.dialogGroup);if(g.kind==='blocked')return;
        fileMatches(g).forEach((f)=>input.checked?state.selected.add(f.id):state.selected.delete(f.id));updateChecks();
      }
      if(input.id==='reduce-motion') { state.motion=input.checked;document.documentElement.dataset.motion=state.motion?'reduced':'system';announce(state.motion?'已减少动效。':'动效跟随系统。'); }
    });
    document.addEventListener('input',(event)=>{
      if(event.target.id==='file-search') { state.fileSearch=event.target.value;renderFiles(); }
      if(event.target.id==='analysis-search') { state.analysisSearch=event.target.value;renderRanking(); }
    });
    document.addEventListener('keydown',(event)=>{
      if((event.key==='Enter'||event.key===' ')&&event.target.matches('g[data-map]')) {
        event.preventDefault();event.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));
      }
    });
    addEventListener('resize',()=>{if(state.stage==='review')renderDock();});
    applyTheme();renderClean();syncTide();
  </script>
</body>
</html>
