[workspace]
members = ["crates/core", "crates/windows", "crates/helper", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.20.0"
edition = "2024"
license = "MIT"
rust-version = "1.97"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
rusqlite = { version = "0.40", features = ["bundled", "hooks"] }
toml = "0.9"
windows = { version = "0.62.2", features = ["ApplicationModel", "Management_Deployment", "Foundation", "Storage", "Win32_System_ApplicationInstallationAndServicing", "Win32_System_Time", "Win32_Foundation", "Win32_Security", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_Storage_Packaging_Appx", "Win32_Globalization", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Environment", "Win32_System_SystemInformation", "Win32_System_RemoteDesktop", "Win32_System_Registry", "Win32_System_IO", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_WindowsProgramming", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

# Keep backtraces useful without retaining full type information and incremental
# object graphs for every development/test feature combination.
[profile.dev]
debug = 1
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
